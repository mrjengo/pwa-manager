[package]
name = "pwa-manager"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Install, edit and remove Chromium-based Progressive Web Apps as native desktop applications"
license = "GPL-3.0-only"
repository = "https://github.com/mrjengo/PWA-Manager"
readme = "README.md"

[dependencies]
anyhow = "1"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "gif", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
url = "2"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.5"

[profile.release]
lto = "thin"
strip = true
